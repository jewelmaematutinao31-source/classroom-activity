```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thank You!</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: url("photo.jpg.jpg") center center / cover fixed no-repeat;
    overflow: hidden;
}

.thank-you {
    width: 90%;
    max-width: 650px;
    text-align: center;
    padding: 45px 30px;
    border-radius: 25px;
    background: url("green.jpg") center center / cover no-repeat;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    position: relative;
    z-index: 2;
}

.thank-you h1 {
    color: #14532d;
    font-size: 42px;
    margin: 0 0 20px;
}

.thank-you p {
    color: #1f2937;
    font-size: 19px;
    line-height: 1.6;
    margin: 10px 0;
}

.message {
    font-weight: bold;
    color: #166534 !important;
    margin-top: 20px !important;
}

.confetti {
    position: fixed;
    top: -20px;
    width: 10px;
    height: 16px;
    z-index: 1;
    animation: fall linear forwards;
}

@keyframes fall {

    0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }

}

@media (max-width: 600px) {

    .thank-you {
        padding: 35px 20px;
    }

    .thank-you h1 {
        font-size: 34px;
    }

    .thank-you p {
        font-size: 17px;
    }

}

</style>

</head>

<body>

<div class="thank-you">

    <h1>
        🎉 Thank You!
    </h1>

    <p>
        Your responses have been successfully submitted.
    </p>

    <p>
        Thank you for sharing your insights and ideas! 😊
    </p>

    <p class="message">
        You are a great teacher! 🌟
    </p>

</div>


<script>

function createConfetti() {

    const confetti = document.createElement("div");

    confetti.className = "confetti";

    confetti.style.left =
        Math.random() * 100 + "vw";

    confetti.style.animationDuration =
        (Math.random() * 3 + 3) + "s";

    confetti.style.backgroundColor =
        ["#166534", "#22c55e", "#facc15", "#f97316", "#3b82f6", "#ec4899"]
        [Math.floor(Math.random() * 6)];

    confetti.style.transform =
        "rotate(" + Math.random() * 360 + "deg)";

    document.body.appendChild(confetti);

    setTimeout(function() {
        confetti.remove();
    }, 6500);

}

for (let i = 0; i < 120; i++) {
    setTimeout(createConfetti, i * 25);
}

</script>

</body>
</html>
